# Prometheus scrape configuration.
# Every service's /metrics endpoint, alert rules (rules/*.yml, unit-tested with
# promtool: `make prometheus-test`) and the broker-side Kafka lag exporter.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: stockintel
    env: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: market-producer
    static_configs:
      - targets: ["market-producer:8001"]

  # One target per replica (works with `--scale stream-processor=N`).
  - job_name: stream-processor
    dns_sd_configs:
      - names: ["stream-processor"]
        type: A
        port: 8002

  - job_name: sinks
    static_configs:
      - targets: ["sink-postgres:8003", "sink-redis:8003"]

  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000

  - job_name: inference
    dns_sd_configs:
      - names: ["inference"]
        type: A
        port: 8010

  - job_name: prediction-pipeline
    static_configs:
      - targets: ["prediction-pipeline:8004"]

  - job_name: model-monitor
    static_configs:
      - targets: ["model-monitor:8005"]

  - job_name: kafka-lag-exporter
    static_configs:
      - targets: ["kafka-lag-exporter:8006"]
