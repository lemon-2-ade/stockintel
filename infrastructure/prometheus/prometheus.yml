# Prometheus scrape configuration.
# Application services register their /metrics targets here as they are added
# (Phase 2+); Phase 11 adds recording rules, alerts and Kafka lag exporting.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: stockintel
    env: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: market-producer
    static_configs:
      - targets: ["market-producer:8001"]

  # One target per replica (works with `--scale stream-processor=N`).
  - job_name: stream-processor
    dns_sd_configs:
      - names: ["stream-processor"]
        type: A
        port: 8002

  - job_name: sinks
    static_configs:
      - targets: ["sink-postgres:8003", "sink-redis:8003"]
