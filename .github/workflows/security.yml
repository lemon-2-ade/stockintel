name: Security

on:
  pull_request:
    paths:
      - uv.lock
      - pyproject.toml
      - "**/pyproject.toml"
      - apps/frontend/package-lock.json
      - .github/workflows/**
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # weekly: new advisories appear without any code change

permissions:
  contents: read

env:
  UV_VERSION: "0.8.17"
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba

jobs:
  python-audit:
    name: pip-audit (locked Python dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv export --frozen --no-hashes --no-emit-workspace -o requirements.audit.txt
      - run: uvx pip-audit -r requirements.audit.txt --no-deps --disable-pip

  npm-audit:
    name: npm audit (dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --audit-level=high

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - run: ./gitleaks detect --source . --redact --no-banner
