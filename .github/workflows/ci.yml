name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.8.17"
  PROMETHEUS_VERSION: "3.5.0"
  PROMETHEUS_SHA256: e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a

jobs:
  python:
    name: Python (lint, types, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Dashboard (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  observability:
    name: Prometheus rules, dashboards, workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install promtool
        run: |
          curl -fsSL -o prometheus.tgz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  prometheus.tgz" | sha256sum -c -
          tar -xzf prometheus.tgz --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          sudo install promtool /usr/local/bin/promtool
      - run: make prometheus-test
      - run: uv run --frozen python scripts/gen_dashboards.py --check
      - run: uv run --frozen python scripts/summarize_benchmarks.py --check
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  compose:
    name: Compose file
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: make compose-config

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -lockfile=readonly
      - run: terraform validate

  images:
    name: Image build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: market-producer, dockerfile: python-service, package: stockintel-market-producer}
          - {image: stream-processor, dockerfile: python-service, package: stockintel-stream-processor}
          - {image: sinks, dockerfile: python-service, package: stockintel-sinks}
          - {image: api, dockerfile: python-service, package: stockintel-api}
          - {image: inference, dockerfile: python-service, package: stockintel-inference}
          - {image: prediction-pipeline, dockerfile: python-service, package: stockintel-prediction-pipeline}
          - {image: model-monitor, dockerfile: python-service, package: stockintel-model-monitor}
          - {image: frontend, dockerfile: frontend, package: ""}
          - {image: mlflow, dockerfile: mlflow, package: ""}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.dockerfile }}.Dockerfile
          build-args: ${{ matrix.package != '' && format('PACKAGE={0}', matrix.package) || '' }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  integration:
    name: Integration tests (Kafka, PostgreSQL, Redis via Compose)
    runs-on: ubuntu-latest
    needs: [python, compose]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Start infrastructure
        run: |
          make env
          make infra-up
      - run: make test-integration
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: make clean
