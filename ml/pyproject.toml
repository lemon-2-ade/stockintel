[project]
name = "stockintel-ml"
version = "0.1.0"
description = "Offline data + ML pipeline: dataset acquisition, validation, features, training, evaluation"
requires-python = ">=3.12,<3.14"
dependencies = [
    "stockintel-shared",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "tzdata>=2024.1",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost-cpu>=2.1",
]

[project.scripts]
sip-acquire = "stockml.data.acquire:main"
sip-calibrate = "stockml.data.calibrate:main"
sip-data-quality = "stockml.data.pipeline:main"
sip-baselines = "stockml.training.baselines:main"
sip-models = "stockml.training.models:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockml"]

[tool.uv.sources]
stockintel-shared = { workspace = true }
